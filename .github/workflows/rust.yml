name: Rust
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
    branches: [release-1.2]

env:
  # From-scratch builds with incremental compilation enabled adds unneeded performance and disk overhead.
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        make_target: ["check-licenses", "build", "integ", "integ-fips"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          - os: windows-latest
            make_target: check-licenses
          - os: macos-latest
            make_target: check-licenses
          - os: macos-latest
            make_target: integ-fips
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .cargo
          # you can edit the .github/cache_bust file if you need to clear the cache
          key: ${{ hashFiles('.github/cache_bust') }}-${{ runner.os }}-${{ matrix.make_target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ hashFiles('.github/cache_bust') }}-${{ runner.os }}-${{ matrix.make_target }}
      - uses: ilammy/setup-nasm@v1 # requirement for windows FIPS builds
      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5
      # print the current rustc. replace stable to pin to a specific toolchain version.
      # - run: rustup default stable
      - run: rustup default 1.84.0
      - run: rustup component add rustfmt
      - run: rustup component add clippy
      - name: Install CMake 3.x (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get remove --purge --auto-remove cmake -y
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO cmake.sh https://github.com/Kitware/CMake/releases/download/v3.27.6/cmake-3.27.6-linux-x86_64.sh
          sudo mkdir -p /opt/cmake
          sudo sh cmake.sh --prefix=/opt/cmake --skip-license
          echo "/opt/cmake/bin" >> $GITHUB_PATH
      - name: Install CMake 3.x (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --version=3.27.6 -y --installargs 'ADD_CMAKE_TO_PATH=System' --allow-downgrade
        shell: powershell
      - run: make ${{ matrix.make_target }}
