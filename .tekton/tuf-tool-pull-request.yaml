apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/securesign/tough?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "release-1.4" && ( "Dockerfile.rh".pathChanged() || ".tekton/tuf-tool-pull-request.yaml".pathChanged()
      || "deny.toml".pathChanged() || "Cargo.toml".pathChanged() || "Cargo.lock".pathChanged()
      || "tough/***".pathChanged() || "tuftool/***".pathChanged() || "Makefile".pathChanged()
      || "trigger-konflux-builds.txt".pathChanged() || "rpms.lock.yaml".pathChanged()
      || "ubi.repo".pathChanged() )
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: tough-v1-4
    appstudio.openshift.io/component: tuf-tool-v1-4
    pipelines.appstudio.openshift.io/type: build
  name: tuf-tool-v1-4-on-pull-request
  namespace: rhtas-tenant
spec:
  params:
  - name: release-version
    value: "1.4.2"
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/securesign/cli-tuftool:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: Dockerfile.rh
  - name: build-source-image
    value: "true"
  - name: prefetch-input
    value: '[{"type": "cargo", "path": "."}, {"type": "rpm", "path": "."}]'
  - name: hermetic
    value: "true"
  - name: dev-package-managers
    value: "true"
  - name: fips-check
    value: "true"
  - name: path-context
    value: .
  - name: image-version
    value: "0.0.1"
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: 'https://github.com/securesign/pipelines.git'
      - name: revision
        value: 'main'
      - name: pathInRepo
        value: 'pipelines/docker-build-oci-ta.yaml'
  taskRunTemplate:
    serviceAccountName: build-pipeline-tuf-tool-v1-4
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
