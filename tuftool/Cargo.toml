[package]
name = "tuftool"
version = "0.12.0"
description = "Utility for creating and signing The Update Framework (TUF) repositories"
authors = ["iliana destroyer of worlds <iweller@amazon.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/awslabs/tough"
keywords = ["tuf", "update", "repository"]
edition = "2018"

[features]
integ = []
default = ["aws-sdk-rust","sigstore_protobuf_specs","sigstore-trust-root"]
aws-sdk-rust = ["aws-sdk-rust-rustls"]
aws-sdk-rust-rustls = ["aws-config/rustls", "aws-sdk-ssm/rustls", "aws-sdk-kms/rustls", ]
sigstore = ["sigstore_protobuf_specs"]
fips = ["tough/fips", "rustls/fips"]

sigstore-trust-root = [
  "sigstore_protobuf_specs",
  "futures-util",
  "regex",
  "tokio/sync",
]

[dependencies]
aws-config = { version = "1", default-features = false, features = ["credentials-process"] }
aws-lc-rs = "1"
aws-sdk-kms = "1"
aws-sdk-ssm = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std", "clock"] }
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
futures = "0.3"
hex = "0.4"
log = "0.4"
maplit = "1"
olpc-cjson = { version = "0.1", path = "../olpc-cjson" }
openssl = { version = "0.10.40" }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
rustls = "0.23"
serde = "1"
serde_json = "1"
serial_test = "3.1.1"
simplelog = "0.12"

sigstore_protobuf_specs = { version = "0.4", default-features = false, optional = true }

snafu = { version = "0.8", features = ["backtraces-impl-backtrace-crate"] }
pem = "3.0.4"
prost-types = "0.13.5"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tough = { version = "0.19", path = "../tough", features = ["http"] }
tough-kms = { version = "0.11", path = "../tough-kms" }
tough-ssm = { version = "0.14", path = "../tough-ssm" }
url = "2"
walkdir = "2"
indexmap = { version = "2.5.0", features = ["serde"] }

rustls-webpki = { version = "0.102.1", features = ["alloc"] }
thiserror = "1.0.30"
base64 = { version = "0.22", default-features = false, features = ["std"] }
futures-util = { version = "0.3.30", optional = true }
tokio-util = { version = "0.7.10", features = ["io-util"] }
tracing = "0.1.31"
rstest = "0.22.0"
regex = { version = "1.5.5", optional = true }
pki-types = { package = "rustls-pki-types", version = "1.12", default-features = false }

[dev-dependencies]
assert_cmd = "2"
futures = "0.3"
futures-core = "0.3"
httptest = "0.16"
